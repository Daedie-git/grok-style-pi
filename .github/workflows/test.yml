name: Tests
on: [push, pull_request]
jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - run: bash -n scripts/sidecar && shellcheck scripts/sidecar
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m json.tool .claude-plugin/plugin.json >/dev/null && python3 -m json.tool .claude-plugin/marketplace.json >/dev/null && python3 -m json.tool hooks/hooks.json >/dev/null
  windows-control:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/test_windows.mjs tests/test_reload.mjs
